[project]
name = "sentinel-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server providing Kubernetes-aware tooling with OpenTelemetry instrumentation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.1.1",
    "kubernetes>=35.0.0",
    "mcp>=1.26.0",
    "opentelemetry-api>=1.40.0",
    "opentelemetry-instrumentation>=0.61b0",
    "opentelemetry-sdk>=1.40.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.6",
"starlette>=0.52.1",
    "uvicorn>=0.42.0",
]
