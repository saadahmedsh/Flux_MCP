[project]
name = "sentinel-mcp"
version = "0.1.0"
description = "AI-powered Kubernetes SRE via the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.1.1",
    "google-genai>=1.68.0",
    "kubernetes>=35.0.0",
    "mcp>=1.26.0",
    "opentelemetry-api>=1.40.0",
    "opentelemetry-sdk>=1.40.0",
    "python-dotenv>=1.2.2",
    "starlette>=0.52.1",
    "uvicorn>=0.42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.6",
]
